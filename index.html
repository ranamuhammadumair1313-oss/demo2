<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMAIR AI STUDIO</title>
    <style>
        /* CSS Variables & Theme */
        :root {
            --bg-gradient: linear-gradient(135deg, #090910 0%, #1a1a2e 50%, #16213e 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-blue: #00f0ff;
            --neon-purple: #8a2be2;
            --text-main: #ffffff;
            --text-muted: #a0a0b0;
            --ai-bubble: rgba(138, 43, 226, 0.15);
            --user-bubble: rgba(0, 240, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Glassmorphism Classes */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
        }

        .neon-text {
            background: linear-gradient(to right, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            height: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid var(--glass-border);
            transition: transform 0.3s ease;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--glass-border);
            letter-spacing: 2px;
        }

        .nav-items {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        .nav-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid transparent;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn:hover, .nav-btn.active {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        /* Main Content */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .view-section {
            display: none;
            flex-direction: column;
            height: calc(100% - 65px);
        }

        .view-section.active {
            display: flex;
        }

        /* Chat UI */
        .chat-container {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 15px;
            border-radius: 12px;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-bubble);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-bottom-right-radius: 2px;
        }

        .message.ai {
            align-self: flex-start;
            background: var(--ai-bubble);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-bottom-left-radius: 2px;
        }

        .message pre {
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            margin-top: 10px;
        }

        .message code {
            font-family: monospace;
            color: var(--neon-blue);
        }

        .msg-actions {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .msg-actions span {
            cursor: pointer;
        }

        .msg-actions span:hover {
            color: var(--neon-blue);
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 10px;
        }

        .input-box {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 15px;
            border-radius: 8px;
            resize: none;
            height: 50px;
            font-size: 16px;
            transition: border 0.3s;
        }

        .input-box:focus {
            outline: none;
            border-color: var(--neon-purple);
            box-shadow: 0 0 10px rgba(138, 43, 226, 0.2);
        }

        .send-btn {
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            border: none;
            color: white;
            padding: 0 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.3s, transform 0.1s;
        }

        .send-btn:hover {
            opacity: 0.9;
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        /* Image Gen UI */
        .image-gen-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
            overflow-y: auto;
        }

        .model-selector {
            background: rgba(0,0,0,0.2);
            color: white;
            border: 1px solid var(--glass-border);
            padding: 10px;
            border-radius: 8px;
            outline: none;
        }

        .image-preview-card {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed var(--glass-border);
            border-radius: 12px;
            min-height: 300px;
            position: relative;
            background: rgba(0,0,0,0.1);
        }

        .image-preview-card img {
            max-width: 100%;
            max-height: 500px;
            border-radius: 8px;
            display: none;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }

        .image-actions {
            display: none;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }

        /* Settings Modal */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal {
            width: 400px;
            padding: 30px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .modal h2 {
            margin-bottom: 10px;
        }

        .modal input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            color: white;
            border-radius: 6px;
        }

        .api-status {
            font-size: 14px;
            color: #ff4d4d;
        }

        .api-status.connected {
            color: #00ff00;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--neon-blue);
            padding: 15px 25px;
            border-radius: 8px;
            color: white;
            transform: translateX(150%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(0);
        }

        /* Loaders & Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .typing-indicator {
            display: none;
            padding: 15px;
            background: var(--ai-bubble);
            border-radius: 12px;
            align-self: flex-start;
            width: fit-content;
        }

        .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--neon-blue);
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Mobile Responsive */
        .mobile-menu-btn {
            display: none;
            background: transparent;
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 50;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                left: -280px;
                z-index: 40;
                background: var(--bg-gradient);
            }
            .sidebar.open {
                left: 0;
            }
            .mobile-menu-btn {
                display: block;
            }
            .header { padding-left: 50px; }
            .message { max-width: 90%; }
        }
    </style>
</head>
<body>

    <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>

    <div class="sidebar glass" id="sidebar">
        <div class="brand neon-text">UMAIR AI</div>
        
        <div class="nav-items">
            <button class="nav-btn active" onclick="switchView('chat')">💬 AI Chat</button>
            <button class="nav-btn" onclick="switchView('image')">🎨 Generate Image</button>
            <button class="nav-btn" onclick="clearChat()">🗑️ Clear Chat</button>
        </div>

        <button class="nav-btn" onclick="openSettings()">⚙️ Settings</button>
    </div>

    <div class="main-content">
        <div class="header glass neon-text" id="header-title">UMAIR AI STUDIO</div>

        <div id="view-chat" class="view-section active">
            <div class="chat-container" id="chat-box">
                </div>
            
            <div class="typing-indicator" id="typing-indicator">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <div class="input-area glass">
                <textarea class="input-box" id="chat-input" placeholder="Message Umair AI... (Press Enter to send)" onkeypress="handleEnter(event)"></textarea>
                <button class="send-btn" onclick="sendChatMessage()">Send</button>
            </div>
        </div>

        <div id="view-image" class="view-section">
            <div class="image-gen-container">
                <select class="model-selector" id="image-model">
                    <option value="stabilityai/stable-diffusion-3-medium">Stable Diffusion 3 Medium (OpenRouter)</option>
                    <option value="flux/flux-schnell">Flux Schnell (OpenRouter)</option>
                </select>
                
                <div class="image-preview-card" id="image-preview-area">
                    <span id="image-placeholder" style="color: var(--text-muted);">Your generated image will appear here</span>
                    <img id="generated-img" src="" alt="AI Generated">
                    <div class="typing-indicator" id="image-loader" style="position:absolute; display:none;">
                        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                    </div>
                </div>

                <div class="image-actions" id="image-actions">
                    <button class="send-btn" onclick="downloadImage()">⬇️ Download</button>
                </div>

                <div class="input-area glass" style="border:none; padding:0;">
                    <textarea class="input-box" id="image-input" placeholder="Describe the image you want to generate..."></textarea>
                    <button class="send-btn" onclick="generateImage()">Generate</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal glass">
            <h2 class="neon-text">API Settings</h2>
            <p style="font-size: 14px; color: var(--text-muted);">Enter your OpenRouter API Key to power UMAIR AI.</p>
            <input type="password" id="api-key-input" placeholder="sk-or-v1-...">
            <div class="api-status" id="api-status">Status: Not Connected</div>
            <div style="display:flex; gap:10px; margin-top: 10px;">
                <button class="send-btn" style="flex:1" onclick="saveApiKey()">Save</button>
                <button class="send-btn" style="flex:1; background: #333;" onclick="closeSettings()">Cancel</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Notification text</div>

    <script>
        // --- STATE & INITIALIZATION ---
        const OPENROUTER_URL = "https://openrouter.ai/api/v1/chat/completions";
        const CHAT_MODEL = "meta-llama/llama-3-8b-instruct:free"; 
        
        let apiKey = localStorage.getItem('umair_openrouter_key') || '';
        let chatHistory = JSON.parse(localStorage.getItem('umair_chat_history')) || [];

        window.onload = () => {
            updateApiStatus();
            renderChatHistory();
            if(chatHistory.length === 0) {
                appendMessage('ai', "Hello! I am **UMAIR AI**, your futuristic assistant powered by OpenRouter. How can I help you today?");
            }
        };

        // --- UI NAVIGATION ---
        function switchView(view) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`view-${view}`).classList.add('active');
            event.currentTarget.classList.add('active');
            
            document.getElementById('header-title').innerText = view === 'chat' ? "UMAIR AI STUDIO - CHAT" : "UMAIR AI STUDIO - IMAGE GEN";
            if(window.innerWidth <= 768) toggleSidebar();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // --- SETTINGS & API KEY ---
        function openSettings() {
            document.getElementById('settings-modal').style.display = 'flex';
            document.getElementById('api-key-input').value = apiKey;
            if(window.innerWidth <= 768) toggleSidebar();
        }

        function closeSettings() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        function saveApiKey() {
            const key = document.getElementById('api-key-input').value.trim();
            if(key) {
                apiKey = key;
                localStorage.setItem('umair_openrouter_key', key);
                updateApiStatus();
                showToast("API Key Saved Successfully!");
                closeSettings();
            } else {
                showToast("Please enter a valid key.");
            }
        }

        function updateApiStatus() {
            const statusEl = document.getElementById('api-status');
            if(apiKey) {
                statusEl.innerText = "Status: API Connected 🟢";
                statusEl.className = "api-status connected";
            } else {
                statusEl.innerText = "Status: API Not Connected 🔴";
                statusEl.className = "api-status";
            }
        }

        // --- CHAT SYSTEM ---
        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendChatMessage();
            }
        }

        function renderChatHistory() {
            const box = document.getElementById('chat-box');
            box.innerHTML = '';
            chatHistory.forEach(msg => appendMessageUI(msg.role, msg.content, false));
            scrollToBottom();
        }

        function clearChat() {
            chatHistory = [];
            localStorage.removeItem('umair_chat_history');
            document.getElementById('chat-box').innerHTML = '';
            appendMessage('ai', "Chat history cleared. Let's start fresh!");
            showToast("Chat Cleared");
            if(window.innerWidth <= 768) toggleSidebar();
        }

        function appendMessage(role, content) {
            chatHistory.push({role, content});
            localStorage.setItem('umair_chat_history', JSON.stringify(chatHistory));
            appendMessageUI(role, content, true);
        }

        function formatMarkdown(text) {
            // Basic markdown parser for bold, italic, code blocks, and newlines
            let formatted = text
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>') // Code blocks
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Bold
                .replace(/\*(.*?)\*/g, '<em>$1</em>') // Italic
                .replace(/\n/g, '<br>'); // Newlines
            return formatted;
        }

        function appendMessageUI(role, content, animate) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            
            const textDiv = document.createElement('div');
            textDiv.innerHTML = formatMarkdown(content);
            div.appendChild(textDiv);

            if(role === 'ai') {
                const actions = document.createElement('div');
                actions.className = 'msg-actions';
                actions.innerHTML = `<span onclick="copyText(this)">📋 Copy</span>`;
                div.appendChild(actions);
            }

            box.appendChild(div);
            scrollToBottom();
        }

        function copyText(btn) {
            const text = btn.parentElement.parentElement.innerText.replace('📋 Copy', '');
            navigator.clipboard.writeText(text.trim());
            showToast("Copied to clipboard!");
        }

        function scrollToBottom() {
            const box = document.getElementById('chat-box');
            box.scrollTop = box.scrollHeight;
        }

        async function sendChatMessage() {
            const inputEl = document.getElementById('chat-input');
            const text = inputEl.value.trim();
            if(!text) return;
            if(!apiKey) return showToast("Please set OpenRouter API Key in Settings!");

            appendMessage('user', text);
            inputEl.value = '';
            
            const typing = document.getElementById('typing-indicator');
            typing.style.display = 'block';
            scrollToBottom();

            // Prepare context for API
            const messages = chatHistory.map(m => ({
                role: m.role === 'ai' ? 'assistant' : 'user',
                content: m.content
            }));

            try {
                const response = await fetch(OPENROUTER_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'UMAIR AI'
                    },
                    body: JSON.stringify({
                        model: CHAT_MODEL,
                        messages: messages
                    })
                });

                const data = await response.json();
                typing.style.display = 'none';

                if(data.error) {
                    appendMessage('ai', `**Error:** ${data.error.message}`);
                } else if(data.choices && data.choices.length > 0) {
                    const aiText = data.choices[0].message.content;
                    appendMessage('ai', aiText);
                }
            } catch (err) {
                typing.style.display = 'none';
                appendMessage('ai', `**System Error:** Could not reach API. Check console or network.`);
                console.error(err);
            }
        }

        // --- IMAGE GENERATION SYSTEM ---
        async function generateImage() {
            const inputEl = document.getElementById('image-input');
            const prompt = inputEl.value.trim();
            const model = document.getElementById('image-model').value;
            
            if(!prompt) return showToast("Please enter an image prompt.");
            if(!apiKey) return showToast("Please set OpenRouter API Key in Settings!");

            document.getElementById('image-placeholder').style.display = 'none';
            document.getElementById('generated-img').style.display = 'none';
            document.getElementById('image-actions').style.display = 'none';
            document.getElementById('image-loader').style.display = 'block';

            try {
                const response = await fetch(OPENROUTER_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'UMAIR AI'
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [{role: "user", content: `Generate an image based on this prompt. Return ONLY the raw markdown image format ![image](url) and nothing else. Prompt: ${prompt}`}]
                    })
                });

                const data = await response.json();
                document.getElementById('image-loader').style.display = 'none';

                if(data.error) {
                    showToast(`Error: ${data.error.message}`);
                    document.getElementById('image-placeholder').style.display = 'block';
                    document.getElementById('image-placeholder').innerText = "Failed to generate image.";
                } else if(data.choices && data.choices.length > 0) {
                    const content = data.choices[0].message.content;
                    // OpenRouter image models often return markdown links
                    const urlMatch = content.match(/!\[.*?\]\((.*?)\)/);
                    let imgUrl = urlMatch ? urlMatch[1] : content;

                    // Fallback to text if URL extraction failed and content doesn't look like a URL
                    if(!imgUrl.startsWith('http')) {
                        showToast("Model returned text instead of image.");
                        document.getElementById('image-placeholder').style.display = 'block';
                        document.getElementById('image-placeholder').innerText = content;
                        return;
                    }

                    const imgEl = document.getElementById('generated-img');
                    imgEl.src = imgUrl;
                    imgEl.style.display = 'block';
                    document.getElementById('image-actions').style.display = 'flex';
                    showToast("Image Generated!");
                }
            } catch (err) {
                document.getElementById('image-loader').style.display = 'none';
                document.getElementById('image-placeholder').style.display = 'block';
                showToast("System Error during generation.");
                console.error(err);
            }
        }

        function downloadImage() {
            const img = document.getElementById('generated-img');
            if(!img.src) return;
            
            // Proxy download via fetch to bypass CORS issues on direct download links
            fetch(img.src)
                .then(response => response.blob())
                .then(blob => {
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = `UMAIR_AI_${Date.now()}.png`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    showToast("Downloading...");
                })
                .catch(() => {
                    // Fallback if CORS prevents blob download
                    window.open(img.src, '_blank');
                });
        }
    </script>
</body>
</html>
