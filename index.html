<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMAIR AI MODEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030014;
            --primary-neon: #00f3ff;
            --secondary-neon: #bc13fe;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(188, 19, 254, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 243, 255, 0.15), transparent 25%);
        }

        /* Typography & Effects */
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; }
        
        .gradient-text {
            background: linear-gradient(90deg, var(--primary-neon), var(--secondary-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }

        /* Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background: rgba(3, 0, 20, 0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-size: 1.5rem; font-weight: 700; letter-spacing: 2px; }

        /* Buttons */
        .btn {
            background: var(--glass-bg);
            border: 1px solid var(--primary-neon);
            color: var(--primary-neon);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.1);
        }

        .btn:hover {
            background: var(--primary-neon);
            color: var(--bg-color);
            box-shadow: 0 0 20px var(--primary-neon);
        }

        .btn-generate {
            background: linear-gradient(45deg, var(--primary-neon), var(--secondary-neon));
            color: #fff;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            width: 100%;
            margin-top: 1rem;
            box-shadow: 0 0 20px rgba(188, 19, 254, 0.4);
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.6);
            color: #fff;
        }

        /* Main Container */
        .container {
            max-width: 1000px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        /* Glassmorphism Cards */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 2rem;
        }

        /* Inputs */
        textarea, input[type="password"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 1rem;
            color: var(--text-main);
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.3s ease;
            resize: vertical;
        }

        textarea:focus, input[type="password"]:focus {
            border-color: var(--primary-neon);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        /* Typing Effect */
        .typing-container {
            text-align: center;
            margin-bottom: 2rem;
            min-height: 40px;
        }
        
        .typing-text {
            font-size: 1.2rem;
            color: var(--text-muted);
            border-right: 2px solid var(--primary-neon);
            white-space: nowrap;
            overflow: hidden;
            display: inline-block;
            animation: blink 0.75s step-end infinite;
        }

        /* Loading Animation */
        .loader {
            display: none;
            width: 50px;
            height: 50px;
            border: 3px solid transparent;
            border-top-color: var(--primary-neon);
            border-bottom-color: var(--secondary-neon);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }

        /* Result Area */
        #result-container {
            display: none;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .generated-image {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(188, 19, 254, 0.3);
            margin: 1rem 0;
            border: 1px solid var(--glass-border);
        }

        /* Gallery Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            width: 90%;
            max-width: 500px;
        }

        /* Animations */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes blink { 50% { border-color: transparent; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            header { flex-direction: column; gap: 1rem; }
            .btn-generate { padding: 0.8rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo gradient-text">UMAIR AI MODEL</div>
        <button class="btn" onclick="toggleSettings()">⚙️ Settings</button>
    </header>

    <div class="container">
        <div class="typing-container">
            <h1 class="gradient-text" style="font-size: 2.5rem; margin-bottom: 0.5rem;">Initialize Creativity</h1>
            <span class="typing-text" id="typewriter"></span>
        </div>

        <div class="glass-card">
            <textarea id="promptInput" rows="4" placeholder="Describe the masterpiece you want to generate... (e.g., A futuristic cyberpunk city in neon colors)"></textarea>
            <button class="btn btn-generate" onclick="generateImage()">Generate Reality</button>
        </div>

        <div class="glass-card" id="output-card" style="display: none;">
            <h3 class="gradient-text" style="text-align: center; margin-bottom: 1rem;">Neural Output</h3>
            <div class="loader" id="loader"></div>
            
            <div id="result-container">
                <img id="output-image" class="generated-image" src="" alt="AI Generated Art">
                <button class="btn" style="margin-top: 1rem;" onclick="downloadCurrent()">📥 Download HD</button>
            </div>
            <div id="error-message" style="color: #ff3366; text-align: center; display: none; margin-top: 1rem;"></div>
        </div>

        <div class="glass-card">
            <h3><span class="gradient-text">Neural Archives</span> (History)</h3>
            <div class="gallery" id="gallery-container">
                </div>
        </div>
    </div>

    <div class="modal" id="settingsModal">
        <div class="glass-card modal-content">
            <h2 class="gradient-text" style="margin-bottom: 1.5rem;">System Configuration</h2>
            <p style="margin-bottom: 0.5rem; color: var(--text-muted);">OpenRouter API Key:</p>
            <input type="password" id="apiKeyInput" placeholder="sk-or-v1-...">
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem; justify-content: flex-end;">
                <button class="btn" style="border-color: var(--text-muted); color: var(--text-muted);" onclick="toggleSettings()">Cancel</button>
                <button class="btn" onclick="saveApiKey()">Save Credentials</button>
            </div>
        </div>
    </div>

    <script>
        // State Variables
        let currentImageUrl = '';
        const HISTORY_KEY = 'umair_ai_history';

        // Initialization
        document.addEventListener('DOMContentLoaded', () => {
            loadHistory();
            startTypewriter();
        });

        // UI & Animations
        function startTypewriter() {
            const texts = ["Synthesizing visual data...", "Powered by advanced neural networks.", "Awaiting your command, Creator."];
            let textIndex = 0;
            let charIndex = 0;
            let isDeleting = false;
            const element = document.getElementById('typewriter');

            function type() {
                const currentText = texts[textIndex];
                if (isDeleting) {
                    element.innerText = currentText.substring(0, charIndex - 1);
                    charIndex--;
                } else {
                    element.innerText = currentText.substring(0, charIndex + 1);
                    charIndex++;
                }

                let typeSpeed = isDeleting ? 50 : 100;

                if (!isDeleting && charIndex === currentText.length) {
                    typeSpeed = 2000; // Pause at end
                    isDeleting = true;
                } else if (isDeleting && charIndex === 0) {
                    isDeleting = false;
                    textIndex = (textIndex + 1) % texts.length;
                    typeSpeed = 500;
                }
                setTimeout(type, typeSpeed);
            }
            type();
        }

        // Settings Management
        function toggleSettings() {
            const modal = document.getElementById('settingsModal');
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                document.getElementById('apiKeyInput').value = localStorage.getItem('umair_ai_key') || '';
                modal.style.display = 'flex';
            }
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('umair_ai_key', key);
                toggleSettings();
                alert('API Key saved securely to local storage.');
            } else {
                alert('Please enter a valid API Key.');
            }
        }

        // Core Image Generation Logic
        async function generateImage() {
            const prompt = document.getElementById('promptInput').value.trim();
            const apiKey = localStorage.getItem('umair_ai_key');

            if (!apiKey) {
                alert('Please configure your OpenRouter API key in Settings first.');
                toggleSettings();
                return;
            }
            if (!prompt) {
                alert('Please enter a prompt to generate an image.');
                return;
            }

            // UI State update
            document.getElementById('output-card').style.display = 'block';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('error-message').style.display = 'none';

            try {
                // Note: Standard OpenRouter is for LLMs. If using a specific image model supported
                // by standard OpenAI SDK formats via OpenRouter, the endpoint format is applied below.
                // Replace 'model-name-here' with the specific OpenRouter multimodal/image model you intend to use.
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "HTTP-Referer": window.location.href, // Required by OpenRouter
                        "X-Title": "UMAIR AI MODEL", // Required by OpenRouter
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "openai/dall-e-3", // Example image model routing
                        messages: [
                            { role: "user", content: `Generate an image based on this prompt: ${prompt}` }
                        ]
                        // Note: If OpenRouter establishes a direct /v1/images/generations endpoint, 
                        // change URL above and body format to: { prompt: prompt, n: 1, size: "1024x1024" }
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || 'Failed to generate image via API.');
                }

                // Handling standard return paths for URLs (adapting based on assumed API structure)
                // If using standard chat completions that return markdown image: extract URL
                let imageUrl = '';
                if (data.choices && data.choices[0].message.content) {
                   const content = data.choices[0].message.content;
                   // Attempt to parse markdown image ![alt](url)
                   const match = content.match(/\((https:\/\/[^\)]+)\)/);
                   if (match) {
                       imageUrl = match[1];
                   } else {
                       throw new Error("The model responded with text instead of an image URL. Please ensure you are routing to an image-capable model.");
                   }
                } else if (data.data && data.data[0].url) {
                    imageUrl = data.data[0].url;
                } else {
                    throw new Error('Image URL not found in the response.');
                }

                currentImageUrl = imageUrl;
                
                // Update UI
                const imgElement = document.getElementById('output-image');
                imgElement.src = imageUrl;
                
                imgElement.onload = () => {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('result-container').style.display = 'block';
                    saveToHistory(imageUrl, prompt);
                };

            } catch (error) {
                document.getElementById('loader').style.display = 'none';
                const errorEl = document.getElementById('error-message');
                errorEl.innerText = 'System Error: ' + error.message;
                errorEl.style.display = 'block';
            }
        }

        // History & Download Logic
        function saveToHistory(url, prompt) {
            let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
            history.unshift({ url, prompt, date: new Date().toISOString() });
            if (history.length > 12) history.pop(); // Keep last 12
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            loadHistory();
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
            const container = document.getElementById('gallery-container');
            container.innerHTML = '';
            
            if(history.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">No neural archives found. Generate your first image.</p>';
                return;
            }

            history.forEach(item => {
                const img = document.createElement('img');
                img.src = item.url;
                img.title = item.prompt;
                img.onclick = () => {
                    document.getElementById('output-card').style.display = 'block';
                    document.getElementById('result-container').style.display = 'block';
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('error-message').style.display = 'none';
                    document.getElementById('output-image').src = item.url;
                    currentImageUrl = item.url;
                    window.scrollTo({ top: document.getElementById('output-card').offsetTop - 100, behavior: 'smooth' });
                };
                container.appendChild(img);
            });
        }

        async function downloadCurrent() {
            if (!currentImageUrl) return;
            try {
                // Fetch the image as a blob to force download instead of opening in a new tab
                const response = await fetch(currentImageUrl);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `UMAIR_AI_${Date.now()}.png`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            } catch (e) {
                // Fallback for CORS issues
                window.open(currentImageUrl, '_blank');
            }
        }
    </script>
</body>
</html>
